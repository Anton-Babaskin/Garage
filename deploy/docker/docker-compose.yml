services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: garage:latest
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: Europe/Istanbul
      TRUST_PROXY: "1"
    volumes:
      - ../../data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
